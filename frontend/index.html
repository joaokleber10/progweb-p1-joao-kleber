<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barbearia · Painel</title>
    <!-- Bootstrap 5.3.8 via CDN, com SRI: o navegador confere o hash do arquivo -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-body-tertiary">
    <header class="bg-primary text-white py-3 mb-4">
      <div class="container">
        <h1 class="h3 mb-0">Barbearia · Painel</h1>
        <p class="mb-0 small">SPA em Vanilla JS consumindo a API da Semana 3</p>
      </div>
    </header>

    <main class="container">
      <!-- Resultado das ações (criar, editar, remover) -->
      <div
        id="aviso"
        class="alert d-none"
        role="status"
        aria-live="polite"
      ></div>

      <!-- ===================== CLIENTES ===================== -->
      <section class="row g-4 mb-5" aria-labelledby="titulo-clientes">
        <!-- Grid de 12 colunas: 4 para o formulário, 8 para a lista -->
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header">
              <h2 id="titulo-clientes" class="h5 mb-0">Clientes</h2>
            </div>
            <form id="form-cliente" class="card-body" novalidate>
              <div class="mb-3">
                <label for="cli-nome" class="form-label">Nome</label>
                <input
                  id="cli-nome"
                  name="nome"
                  type="text"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="cli-email" class="form-label">E-mail</label>
                <input
                  id="cli-email"
                  name="email"
                  type="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="cli-telefone" class="form-label">Telefone</label>
                <input
                  id="cli-telefone"
                  name="telefone"
                  type="tel"
                  class="form-control"
                  inputmode="numeric"
                  placeholder="(83) 99999-0000"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="cli-idade" class="form-label"
                  >Idade (opcional)</label
                >
                <input
                  id="cli-idade"
                  name="idade"
                  type="number"
                  class="form-control"
                  inputmode="numeric"
                  min="0"
                  max="120"
                />
              </div>
              <div class="d-flex gap-2">
                <button id="cli-salvar" type="submit" class="btn btn-primary">
                  Cadastrar cliente
                </button>
                <button
                  id="cli-cancelar"
                  type="button"
                  class="btn btn-outline-secondary d-none"
                >
                  Cancelar
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <!-- Os quatro estados da lista: só um aparece por vez -->
              <div id="clientes-carregando" class="text-center py-4">
                <div
                  class="spinner-border text-primary"
                  aria-hidden="true"
                ></div>
                <p class="text-muted mt-2 mb-0">Carregando clientes…</p>
              </div>

              <div
                id="clientes-erro"
                class="alert alert-danger mb-0 d-none"
                role="alert"
              >
                <p id="clientes-erro-msg" class="mb-2"></p>
                <button
                  id="clientes-recarregar"
                  type="button"
                  class="btn btn-sm btn-outline-danger"
                >
                  Tentar de novo
                </button>
              </div>

              <p
                id="clientes-vazio"
                class="text-muted text-center py-4 mb-0 d-none"
              >
                Nenhum cliente ainda. Cadastre o primeiro no formulário.
              </p>

              <div id="clientes-sucesso" class="table-responsive d-none">
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th scope="col">#</th>
                      <th scope="col">Nome</th>
                      <th scope="col">E-mail</th>
                      <th scope="col">Telefone</th>
                      <th scope="col">Idade</th>
                      <th scope="col" class="text-end">Ações</th>
                    </tr>
                  </thead>
                  <tbody id="clientes-linhas"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="container text-muted small pb-4">
      Programação Web · UEPB · 2026.2 · Semana 4
    </footer>

    <!-- type="module": habilita import/export e só roda depois de o HTML virar DOM -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
